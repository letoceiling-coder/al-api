server {
    listen 80;
    listen [::]:80;
    server_name api.siteaccess.ru;
    return 301 https://api.siteaccess.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.siteaccess.ru;

    ssl_certificate /etc/letsencrypt/live/api.siteaccess.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.siteaccess.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/AL/public;
    index index.php;
    client_max_body_size 100M;

    # API endpoints TrendAgent - обрабатываются Laravel (ПЕРЕД статическими файлами)
    location = /trendagent/swagger {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location = /trendagent/swagger.json {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # API endpoints - должны быть ПЕРЕД общим location /trendagent/
    location ~ ^/trendagent/(authenticate|cities|apartments|parkings|houses|plots|commercial|houseprojects|objects|block)(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Статические файлы React приложения TrendAgent (только для файлов, не API)
    location /trendagent/ {
        # Проверяем, что это не API endpoint
        if ($uri ~ ^/trendagent/(authenticate|cities|apartments|parkings|houses|plots|commercial|houseprojects|objects|block)) {
            return 404;
        }
        alias /var/www/AL/public/trendagent/;
        try_files $uri $uri/ /trendagent/index.html;
        index index.html;
        autoindex off;
    }
    
    location = /trendagent {
        return 301 /trendagent/;
    }

    # API endpoints (Laravel)
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Главная страница - документация
    location = / {
        try_files /index_docs.html =404;
    }
    
    location /docs {
        try_files /index_docs.html =404;
    }
    
    # Статические файлы React приложения Frontend (если существует)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
