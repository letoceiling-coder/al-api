# p-d-a-b.neeklo.ru — сначала только HTTP; после certbot --nginx добавится HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name p-d-a-b.neeklo.ru;

    root /var/www/AL/public;
    index index.html index.php;
    client_max_body_size 100M;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /trendagent/swagger {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /trendagent/swagger.json {
        try_files $uri $uri/ /index.php?$query_string;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    location = /trendagent/db {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /trendagent-db {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /trendagent/ {
        alias /var/www/AL/public/trendagent/;
        try_files $uri $uri/ /trendagent/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public immutable";
        }
        location = /trendagent/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    location /docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /frontend/ {
        alias /var/www/AL/public/frontend/;
        try_files $uri $uri/ /frontend/index.html;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html /index.php?$query_string;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public immutable";
        }
    }

    location /react {
        alias /var/www/AL/public/react;
        try_files $uri $uri/ /react/index.html;
        index index.html;
    }

    location ~ ^/api/v1/ai/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_buffering off;
        fastcgi_keep_conn on;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
