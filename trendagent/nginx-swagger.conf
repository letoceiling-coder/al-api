# Nginx конфигурация для TrendAgent API Swagger
# Добавить в конфигурацию api.siteaccess.ru ПЕРЕД блоком location /trendagent

# Исключения для Swagger - должны обрабатываться Laravel
location = /trendagent/swagger {
    try_files $uri $uri/ /index.php?$query_string;
}

location = /trendagent/swagger.json {
    try_files $uri $uri/ /index.php?$query_string;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
}

# Блок для обслуживания React приложения по /trendagent
location /trendagent {
    alias /var/www/al-api/public/trendagent;
    try_files $uri $uri/ /trendagent/index.html;
    
    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Отключить кэширование для index.html
    location = /trendagent/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
